name: Deploy CV to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CV Docker image
        run: docker compose build

      - name: Render Polish CV
        run: docker compose run --rm cv render resume-pl.json -t jsonresume-theme-stackoverflow -o pl/index.html

      - name: Render English CV
        run: docker compose run --rm cv render resume-en.json -t jsonresume-theme-stackoverflow -o en/index.html

      - name: Localize Polish CV
        run: docker run --rm -v "$(pwd):/cv" -w /cv alpine sh /cv/localize-pl.sh

      - name: Inject SEO tags
        run: docker run --rm -v "$(pwd):/cv" -w /cv alpine sh /cv/seo-inject.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
