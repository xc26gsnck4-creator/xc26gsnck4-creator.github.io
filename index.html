<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubert Jedrzejek | Senior Laravel Developer | CV</title>
  <meta name="description" content="Senior Laravel developer with 15+ years PHP experience. Choose language version: Polish or English CV.">
  <link rel="canonical" href="https://hubertjedrzejek.pl/">
  <link rel="alternate" hreflang="en" href="https://hubertjedrzejek.pl/en/">
  <link rel="alternate" hreflang="pl" href="https://hubertjedrzejek.pl/pl/">
  <link rel="alternate" hreflang="x-default" href="https://hubertjedrzejek.pl/en/">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="Hubert Jedrzejek | Senior Laravel Developer | CV">
  <meta property="og:description" content="Senior Laravel developer with 15+ years PHP experience. Choose language version: Polish or English CV.">
  <meta property="og:url" content="https://hubertjedrzejek.pl/">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="pl_PL">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Hubert Jedrzejek | Senior Laravel Developer">
  <meta name="twitter:description" content="Senior Laravel developer with 15+ years PHP experience.">
  <script>
    // Auto-redirect based on browser language
    (function() {
      // Skip if user chose language manually (?stay) or already visited
      if (window.location.search.includes('stay') || sessionStorage.getItem('languageChosen')) {
        return;
      }

      var lang = navigator.language || navigator.userLanguage;

      // Polish browser → polish CV
      if (lang.startsWith('pl')) {
        window.location.href = 'pl/';
      } else {
        // Everything else → English
        window.location.href = 'en/';
      }
    })();
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .buttons {
      display: flex;
      gap: 1rem;
    }

    a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2rem;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1.1rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    a.active {
      background: #333;
      color: white;
    }

    .flag {
      font-size: 1.5rem;
    }

    .auto-note {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <h1>Hubert Jedrzejek</h1>
  <p>Wybierz wersje jezykowa CV / Choose language</p>
  <div class="buttons">
    <a href="pl/?stay" onclick="sessionStorage.setItem('languageChosen', '1')">
      <span class="flag">PL</span>
      Polski
    </a>
    <a href="en/?stay" onclick="sessionStorage.setItem('languageChosen', '1')">
      <span class="flag">EN</span>
      English
    </a>
  </div>
  <p class="auto-note">Automatyczne przekierowanie na podstawie jezyka przegladarki</p>
</body>
</html>
